# Castrapid production stack. It runs anywhere Docker runs. To change server,
# see the steps in README.md.
# Start it with: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
name: castrapid

services:
  castrapid:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    image: castrapid:local
    container_name: castrapid
    restart: always
    env_file:
      - .env
    environment:
      MAIN_URL: ${PUBLIC_URL}
      FRONTEND_URL: ${PUBLIC_URL}
      NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_URL}/api
      MCP_URL: ${PUBLIC_URL}
      BACKEND_INTERNAL_URL: http://localhost:3000
      DATABASE_URL: postgresql://castrapid:${POSTGRES_PASSWORD}@castrapid-postgres:5432/castrapid
      REDIS_URL: redis://castrapid-redis:6379
      TEMPORAL_ADDRESS: castrapid-temporal:7233
      IS_GENERAL: 'true'
      RUN_CRON: 'true'
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      NX_ADD_PLUGINS: 'false'
    volumes:
      - castrapid-uploads:/uploads/
    networks:
      - web
      - data
    depends_on:
      castrapid-postgres:
        condition: service_healthy
      castrapid-redis:
        condition: service_healthy
      castrapid-temporal:
        condition: service_started

  # Serves the home and legal pages, and sends everything else to the app.
  castrapid-web:
    image: caddy:2.10-alpine
    container_name: castrapid-web
    restart: always
    ports:
      - '127.0.0.1:${WEB_PORT:-8088}:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site:/srv/site:ro
      - castrapid-caddy-data:/data
    networks:
      - web
    depends_on:
      - castrapid

  castrapid-postgres:
    image: postgres:17-alpine
    container_name: castrapid-postgres
    restart: always
    environment:
      POSTGRES_USER: castrapid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: castrapid
    volumes:
      - castrapid-postgres:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: pg_isready -U castrapid -d castrapid
      interval: 10s
      timeout: 3s
      retries: 5

  castrapid-redis:
    image: redis:7.2
    container_name: castrapid-redis
    restart: always
    volumes:
      - castrapid-redis:/data
    networks:
      - data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 5

  castrapid-temporal-elasticsearch:
    image: elasticsearch:7.17.27
    container_name: castrapid-temporal-elasticsearch
    restart: always
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    volumes:
      - castrapid-temporal-elasticsearch:/usr/share/elasticsearch/data
    networks:
      - data

  castrapid-temporal-postgres:
    image: postgres:16
    container_name: castrapid-temporal-postgres
    restart: always
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD}
    volumes:
      - castrapid-temporal-postgres:/var/lib/postgresql/data
    networks:
      - data

  castrapid-temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: castrapid-temporal
    restart: always
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=castrapid-temporal-postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=castrapid-temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    volumes:
      - ../dynamicconfig:/etc/temporal/config/dynamicconfig
    networks:
      - data
    depends_on:
      - castrapid-temporal-postgres
      - castrapid-temporal-elasticsearch

volumes:
  castrapid-postgres:
  castrapid-redis:
  castrapid-uploads:
  castrapid-caddy-data:
  castrapid-temporal-postgres:
  castrapid-temporal-elasticsearch:

networks:
  web:
  data:
